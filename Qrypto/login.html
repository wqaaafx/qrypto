<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | QRYPTO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root { --primary: #ff6b00; --bg: #0a0a0a; --card: #161616; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .auth-card { background: var(--card); padding: 40px; border-radius: 24px; width: 100%; max-width: 420px; border: 1px solid rgba(255,107,0,0.25); box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
        .logo { text-align: center; font-size: 28px; font-weight: 900; color: var(--primary); margin-bottom: 10px; letter-spacing: 2px; }
        h2 { text-align: center; font-size: 20px; color: #ccc; font-weight: 400; margin-bottom: 35px; }
        .input-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 7px; font-size: 13px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 13px 16px; background: #0d0d0d; border: 1px solid #2a2a2a; border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 15px; background: var(--primary); color: #fff; border: none; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; margin-top: 8px; }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .footer-link { text-align: center; margin-top: 22px; font-size: 14px; color: #666; }
        .footer-link a { color: var(--primary); text-decoration: none; }
        .message { padding: 12px; border-radius: 10px; margin-bottom: 15px; font-size: 14px; text-align: center; display: none; }
        .message.error { background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.3); color: #ff6b6b; }
        .message.success { background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.3); color: #2ecc71; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="logo">QRYPTO</div>
    <h2>С возвращением!</h2>
    <div id="msg" class="message"></div>
    <form id="loginForm">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="ivan@example.com" required>
        </div>
        <div class="input-group">
            <label>Пароль</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn" id="loginBtn">Войти в кабинет →</button>
    </form>
    <div class="footer-link">Нет аккаунта? <a href="signup.html">Зарегистрироваться</a></div>
</div>

<script>
    const db = supabase.createClient(
        'https://dwpslpqqasabxilqtkvm.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR3cHNscHFxYXNhYnhpbHF0a3ZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzODQ4OTAsImV4cCI6MjA5NDk2MDg5MH0.YCKirX0pAJYw6gsIxs3KAGNe5YKl6acgs93xxjpPpew'
    );

    // Если уже залогинен — сразу в кабинет
    db.auth.getSession().then(({ data: { session } }) => {
        if (session) window.location.href = 'dashboard.html';
    });

    function showMessage(text, type) {
        const el = document.getElementById('msg');
        el.innerHTML = text;
        el.className = 'message ' + type;
        el.style.display = 'block';
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email    = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btn      = document.getElementById('loginBtn');

        btn.disabled = true;
        btn.textContent = 'Входим...';

        try {
            const { data, error } = await db.auth.signInWithPassword({ email, password });

            if (error) throw error;

            showMessage('Вход выполнен! Переходим...', 'success');
            setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);

        } catch (err) {
            console.error(err);
            let msg = err.message;
            if (msg.includes('Invalid login credentials')) msg = 'Неверный email или пароль';
            if (msg.includes('Email not confirmed')) msg = 'Подтвердите email или отключите подтверждение в Supabase';
            showMessage(msg, 'error');
            btn.disabled = false;
            btn.textContent = 'Войти в кабинет →';
        }
    });
</script>
</body>
</html>
